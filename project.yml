name: WorkSlop
options:
  bundleIdPrefix: com.adnan120hz
  deploymentTarget:
    iOS: "26.0"
packages:
  Minimuxer:
    path: Vendor
targets:
  WorkSlop:
    type: application
    platform: iOS
    info:
      path: WorkSlop/Info.plist
      properties:
        CFBundleName: WorkSlop
        CFBundleDisplayName: WorkSlop
        CFBundleShortVersionString: "4.0"
        CFBundleVersion: "11"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "WorkSlop advertises this iPhone as a pairing host on your local network so it can generate its own pairing file (Get Pairing File). Nothing is sent to the internet."
        NSBonjourServices:
          - _remotepairing-pairable-host._tcp
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.adnan120hz.workslop.tendies
            UTTypeDescription: PosterBoard tendies package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - tendies
    sources:
      - path: WorkSlop
        excludes:
          # Bundled separately below as a folder reference so the
          # Light/Dark/Tinted subdirectory structure survives into
          # the app bundle (the catalog looks icons up by it).
          - iOS18Icons
      - path: WorkSlop/iOS18Icons
        type: folder
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: WebKit.framework
      - package: Minimuxer
        product: Minimuxer
      - package: Minimuxer
        product: ZIPFoundation
      - package: Minimuxer
        product: AirliftFFI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "4.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  WorkSlopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WorkSlopUITests
    dependencies:
      - target: WorkSlop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop.uitests
