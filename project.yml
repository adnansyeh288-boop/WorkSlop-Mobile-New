name: WorkSlop
options:
  bundleIdPrefix: com.adnan120hz
  deploymentTarget:
    iOS: "26.0"
packages:
  Minimuxer:
    path: Vendor
targets:
  WorkSlop:
    type: application
    platform: iOS
    info:
      path: WorkSlop/Info.plist
      properties:
        CFBundleName: WorkSlop
        CFBundleDisplayName: WorkSlop
        CFBundleShortVersionString: "15.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.adnan120hz.workslop.tendies
            UTTypeDescription: PosterBoard tendies package
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - tendies
    sources:
      - path: WorkSlop
        excludes:
          # The iOS 18 icon-pack PNGs stay in the repo but are no
          # longer bundled: Icon Themes has no engine in the GN
          # backend (not ported), so the pack would be dead weight.
          - iOS18Icons
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: WebKit.framework
      - package: Minimuxer
        product: Minimuxer
      - package: Minimuxer
        product: ZIPFoundation
      - package: Minimuxer
        product: AirliftFFI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "15.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
  WorkSlopUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WorkSlopUITests
    dependencies:
      - target: WorkSlop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adnan120hz.workslop.uitests
